{% extends 'base.html' %}
{% load static %}

{% block extra_head %}

    <link rel="stylesheet" href="{% static 'css/agricultores/flow_agricultor.css' %}">
    <script src="https://unpkg.com/cytoscape@3.31.2/dist/cytoscape.min.js"></script>

{% endblock extra_head %}

{% block extra_js %}
{{ block.super }}
<script>
    const fluxo = JSON.parse(
        document.getElementById('fluxo-data').textContent
    );

    const cy = cytoscape({
        container: document.getElementById("cy"),

        elements: fluxo,

        style: [

            {
                selector: 'node[tipo="SS"]',
                style: {
                    "shape": "roundrectangle",
                    "width": 250,
                    "height": 250,

                    "background-color": "#000",
                    'background-opacity': 0,

                    "background-image": "data(imagem)",
                    "background-fit": "cover",
                    "background-repeat": "no-repeat",

                    "border-width": 4,
                    "border-color": "#27ae60",

                    "label": "data(label)",
                    "font-size": 20,
                    "font-weight": "bold",
                    "color": "#2d5016",

                    "text-valign": "bottom",
                    "text-halign": "center",

                    "text-background-color": "#ffffff",
                    "text-background-opacity": 0.9,
                    "text-background-padding": 4
                }
            },

            {
                selector: 'node[tipo="TS"]',
                style: {
                    "shape": "roundrectangle",
                    "width": 250,
                    "height": 250,

                    "background-color": "#000",
                    'background-opacity': 0,

                    "background-image": "data(imagem)",
                    "background-fit": "cover",
                    "background-repeat": "no-repeat",

                    "border-width": 4,
                    "border-color": "#3498db",

                    "label": "data(label)",
                    "font-size": 20,
                    "font-weight": "bold",

                    "text-valign": "bottom",
                    "text-halign": "center",

                    "text-background-color": "#ffffff",
                    "text-background-opacity": 0.9,
                    "text-background-padding": 4
                }
            },

            {
                selector: 'node[tipo="ME"]',
                style: {
                    "shape": "roundrectangle",
                    "width": 250,
                    "height": 250,

                    "background-image": "data(imagem)",
                    "background-fit": "cover",
                    "background-repeat": "no-repeat",

                    "label": "data(label)",
                    "font-size": 20,
                    "font-weight": "bold",

                    "color": "#7a5e00",

                    "border-width": 4,
                    "border-color": "#f39c12",

                    "text-valign": "center",
                    "text-halign": "center"
                }
            },

            {
                selector: 'node[tipo="produto"]',
                style: {
                    "shape": "rectangle",

                    "width": 100,
                    "height": 100,

                    "background-color": "#fff",
                    'background-opacity': 0,
                    "background-image": "data(imagem)",
                    "background-fit": "contain",
                    "background-repeat": "no-repeat",

                    "border-width": 0,

                    "label": "data(label)",
                    "font-size": 16,
                    "color": "#2d5016",

                    "text-valign": "bottom",
                    "text-halign": "center",

                    "text-background-color": "#ffffff",
                    "text-background-opacity": 0.9,
                    "text-background-padding": 3
                }
            },

            {
                selector: 'node[tipo="destino"]',
                style: {
                    "shape": "roundrectangle",
                    "width": 130,
                    "height": 70,

                    "background-color": "#fff4c7",

                    "label": "data(label)",
                    "font-size": 20,
                    "font-weight": "bold",

                    "color": "#7a5e00",

                    "border-width": 34,
                    "border-color": "#f5b900",

                    "text-valign": "center",
                    "text-halign": "center"
                }
            },

            {
                selector: 'edge[tipo="producao"]',
                style: {
                    "width": 4,
                    "line-color": "#6ab04c",
                    "target-arrow-shape": "none",
                    "curve-style": "bezier"
                }
            },
            {
                selector: 'edge[tipo="fluxo"]',
                style: {
                    "width": 4,
                    "line-color": "#6ab04c",
                    "target-arrow-color": "#6ab04c",
                    "target-arrow-shape": "triangle",
                    "arrow-scale": 2.0,
                    "curve-style": "bezier"
                }
            }
        ],

        layout: {
            name: "cose",
            animate: false,
            fit: true,
            padding: 100,
            nodeRepulsion: 10000,
            idealEdgeLength: 300,
            avoidOverlap: true,
            nodeOverlap: 30,
            componentSpacing: 200
        }
    });

    cy.on('tap', 'node[tipo="produto"]', function(event) {

        const produto = event.target;
        const nome = produto.data('label');
        const fluxos = produto.data('fluxos') || [];

        const painel = document.getElementById('produto-info');
        const nomeElemento = document.getElementById('produto-nome');
        const container = document.getElementById('produto-fluxos');

        nomeElemento.textContent = nome;

        container.innerHTML = '';

        if (fluxos.length === 0) {
            container.innerHTML = `
                <p>Nenhum fluxo registrado.</p>
            `;
        } else {

            fluxos.forEach(fluxo => {

                const item = document.createElement('div');

                item.classList.add('fluxo-item');

                const quantidade = fluxo.quantidade || 0;
                const unidade = fluxo.unidade || '';
                const destino = fluxo.destino || 'Mundo Externo';

                item.innerHTML = `
                    <strong>${destino}</strong>
                    <p>${quantidade} ${unidade}</p>
                `;

                container.appendChild(item);
            });
        }

        painel.classList.add('visivel');
    });

    const btnClose = document.getElementById('fechar-produto')
    const painel = document.getElementById('produto-info');

    btnClose.addEventListener('click', function () {
        if (painel.classList.contains('visivel')){
            painel.classList.remove('visivel');
        }
    })

</script>

{% endblock extra_js %}

{% block center %}
<a href="{% url 'flow_list' family.id %}" class="btn-voltar-page">
    <span class="material-symbols-outlined">arrow_back</span>
    Voltar
</a>

<div class="page active">
    <div class="page-header">
        <h1 class="page-title">{% block title %}{{ title }}{% endblock title %}</h1>
    </div>
    
    {{ fluxo|json_script:"fluxo-data" }}

    <div id="cy">
    </div>

    <div id="produto-info" class="produto-info">
        <button id="fechar-produto" type="button">
            ×
        </button>
        <h3 id="produto-nome"></h3>
        <div id="produto-fluxos"></div>
    </div>
</div>

</div>
{% endblock %}
