{% extends 'base.html' %}
{% load static %}

{% block extra_head %}

    <link rel="stylesheet" href="{% static 'css/flowlist.css' %}">
    <link rel="stylesheet" href="{% static 'css/formflow.css' %}">

{% endblock extra_head %}

{% block center %}

<a href="{% url 'dashboard' %}" class="btn-voltar-page">
    <span class="material-symbols-outlined">arrow_back</span>
    Voltar
</a>

<div class="flow-header">
    <div class="flow-header-main">
        <h1 class='title'>{% block title %}{{ title }}{% endblock title %} {{ family.nome_titular }}</h1>
    </div>
</div>

<div class="box-flowlist">
    <form method="post">
        {% csrf_token %}
        <div class="add-flow-group">
            <label for="year-select">Ano do fluxo</label>
            <select id="year-select" class="year-select" name="ano">
                {% for y in anos %}
                    <option value="{{ y }}" {% if y == current_year %}selected{% endif %}>{{ y }}</option>
                {% endfor %}
            </select>
        </div>
        <p class="label-section-subsystems">Subsistemas</p>
        <div class="form-sandbox">
            {% for subsystem in subsystems %}
                <div class='form-subsystem-block' id="form-block{{ subsystem.id }}">
                    <label>
                        <input type="checkbox" class="subsystem-checkbox" name="subsistemas" value="{{ subsystem.id }}"
                            {% if subsystem.id in selected_ids or subsystem.nome_subsistema == "UFPA" or subsystem.nome_subsistema == "Mercado Local" %}checked{% endif %}>
                        <div class="block-content">
                            <div class="subsys-image">
                                {% if subsystem.get_photo_url %}
                                <img src="{{ subsystem.get_photo_url }}" alt="{{ subsystem.nome_subsistema }}" class="form-subsystem-image">
                                {% else %}
                                <img src="{% static 'img/fotos_subsistemas/' %}{{subsystem.id}}/{{subsystem.id}}.jpg" alt="imagem aleatória" class="form-subsystem-image">
                                {% endif %}
                            </div>
                            <div class="subsys-info">
                                <div class="name-subsys">{{ subsystem.nome_subsistema }}</div>
                                {% if subsystem.tipo == 'ME' %}
                                    <p class="subsys-type">Mundo Externo</p>
                                {% elif subsystem.tipo == 'TS' %}
                                    <p class="subsys-type">Tecnologia social</p>
                                {% else %}
                                    <p class="subsys-type">Subsistema</p>
                                {% endif %}
                            </div>
                        </div>
                    </label>
                </div>
            {% endfor %}
        </div>
        <div class="subsystem-btn-submit">
            <button type="submit" class="btn btn-success">Salvar fluxo</button>
        </div>
    </form>
</div>

{% endblock %}
